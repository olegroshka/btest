[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantdsl-backtest"
version = "0.1.0"
description = "Experimental internal DSL for trading strategy backtesting."
readme = "README.md"
requires-python = "==3.11.*"

# Core runtime dependencies
dependencies = [
  "pandas>=2.0",
  # NumPy 1.24+ provides official Python 3.11 wheels; avoid pinning below 1.24
  "numpy>=1.24,<3.0",
  "vectorbt>=0.28",      # core backtesting & YFData
  "quantstats>=0.0.62",
  "yfinance>=0.2.40",    # Yahoo backend used by vectorbt.YFData
  "plotly>=5.0",         # for plots from pf.plot(), etc.
  "pyarrow",             # for efficient data storage
  "lxml",                # for XML parsing
  "polars>=1.4,<2.0",    # high-performance dataframe engine (optional path)
  "arcticdb>=3.0.0",     # local/remote versioned cache
  "fredapi>=0.5.2",      # FRED API client
  "pandas-stubs~=2.3.3",
  "streamlit>=1.53.1",
  "nbformat>=5.10.4",
  "ipywidgets>=8.1.8",
  "statsmodels>=0.14.6",
  "scikit-learn>=1.7.2",
  "scipy-stubs~=1.15.3",
]

[project.optional-dependencies]
dev = [
  "ipykernel",
  "pytest>=8.0",
  "pytest-mock>=3.12",
  "pytest-xdist>=3.6",
  "httpx>=0.27",
  "mypy>=1.10",
  "black>=24.0",
  "isort>=5.13",
  # Type stubs should be dev-only to avoid unnecessary runtime installs
  "pandas-stubs==2.3.3.251201",
  # SMIM acceptance test reference implementations
  "pydmd>=1.0",
  "ripser>=0.6",
  "persim>=0.3",
  # R-TE-1: IDTxl (not on PyPI — installed from GitHub) + Java bridge
  # Install manually: uv pip install "idtxl @ git+https://github.com/pwollstadt/IDTxl.git"
  "JPype1>=1.5",
  "setuptools>=61",   # provides pkg_resources required by idtxl.estimators_jidt
]

platform = [
  "fastapi>=0.115",
  "uvicorn>=0.38",
  "pydantic>=2.7",
  "httpx>=0.27",
  "websockets>=15.0.1",
]

gpu = [
  "torch>=2.2",
]

benchmarks = [
  "pytest-benchmark>=4.0",
]

# Browser-level UI E2E tests (executes JS)
e2e = [
  "playwright>=1.57.0",
]

[project.urls]
Homepage = "https://github.com/olegroshka/btest"
Repository = "https://github.com/olegroshka/btest"

[tool.pytest.ini_options]
markers = [
  "unit: fast unit tests (default testpaths)",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "smoke: smoke tests for live environments",
  "manual: manual tests that require external setup",
]
filterwarnings = [
  "ignore:.*BlockManagerUnconsolidated.*:DeprecationWarning",
  "ignore:websockets\\.legacy is deprecated.*:DeprecationWarning",
  "ignore:websockets\\.server\\.WebSocketServerProtocol is deprecated.*:DeprecationWarning",
]
# Default: run only fast unit tests. Run slow tests explicitly via:
#   pytest -q tests_slow
# or
#   pytest -q -m slow
addopts = ""
testpaths = [
  "tests/unit",
]
