# Usage notes:
# - Blended rate calculation: If you borrow £500k, you pay:
#   - 5.196% on first £80k
#   - 4.696% on remaining £420k
#   - Weighted average = (80k * 5.196% + 420k * 4.696%) / 500k = 4.816%
#
# - Minimum floor: 0.75% minimum charged on all margin loans
# - Interest accrued daily, posted monthly (3rd business day of following month)
# - Rates subject to change without notice
