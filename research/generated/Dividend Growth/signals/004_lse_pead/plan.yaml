plan_id: LSE_EARNINGS_PEAD_S004
parent_strategy: US_FUNDAMENTAL_DIVGROWTH
signal_slug: 004_lse_pead
exchange: LSE
catalog_source: internal_generated

# ── Hypothesis ────────────────────────────────────────────────────────────────
hypothesis: >
  Post-Earnings Announcement Drift (PEAD) on LSE companies: stocks with
  large positive earnings surprises (high SUE) continue to outperform for
  ~21 trading days after the report. Signal expires naturally after the hold
  window — positions exit on next daily rebalance.
  SUE = eps_difference / rolling_std(eps_actual, 8Q), clipped ±5σ.

# ── Signal ───────────────────────────────────────────────────────────────────
signals:
  - name: Standardised Unexpected Earnings (SUE)
    identifier: sue
    formula: "(eps_actual - eps_estimate) / rolling_std(eps_actual, 8Q), clipped ±5σ"
    source_tables: [eodhd.earnings_history (exchange=LSE), eodhd.prices (exchange=LSE)]
    weight: 1.0
    notes: >
      Forward-filled for HOLD_DAYS=21 trading days from report_date.
      Signal = NaN after 21 days → position exits on next daily rebalance.
      No lookahead: rolling_std uses shift(1) — current quarter excluded.

# ── Execution ─────────────────────────────────────────────────────────────────
execution:
  long_n: 8            # sparse on any given day (~13 active median) — reduced from 15
  short_n: 0           # long-only
  rebalance: 1d        # must be daily — signal expires per-ticker
  direction: long_only
  costs_commission_bps: 10.0
  delay_bars: 1        # report_date signal → trade at next close (MOC)
  universe_filters:
    - HasHistory(min_days=252)
    - MinPrice(min_price=100.0)   # GBX

# ── Limitations ───────────────────────────────────────────────────────────────
limitations:
  blockers: []
  warnings:
    - "Active universe is very sparse — median ~13 tickers with live events on any day"
    - "Daily rebalance → high turnover and commission drag at 10bps"
    - "LSE analyst coverage thinner than US — EPS estimates only for ~200–400 tickers"
    - "Short side planned but not implemented: negative-SUE shorts thin and hard to borrow"
    - "MOC execution assumes full fill at close — LSE small-caps may have liquidity constraints"
  pit_lag_days: 1
  recommended_start: "2015-01-01"

# ── Variants ──────────────────────────────────────────────────────────────────
variants:
  - id: v1_baseline
    status: completed
    top_n: 8
    hold_days: 21
    sue_vol_window: 8
    rebalance: 1d
    notes: "001_baseline run; results not yet recorded from new path"
    sharpe: ~

  - id: v2_quality_filter
    status: planned
    notes: >
      Add LSE Dividend EPS composite (from S003) as quality gate:
      only buy PEAD tickers that are also in the top-50th percentile
      of the S003 composite. Reuses composite_aligned.parquet.
      Build script: reference research/generated/LSE PEAD/002_quality_filter/build_signals.py

  - id: v3_hold_10d
    status: planned
    hold_days: 10
    notes: "Shorter hold window — test if drift is front-loaded in days 1–10"

  - id: v4_long_short
    status: planned
    short_n: 4
    notes: "Short bottom-4 by SUE rank (negative surprise stocks)"

# ── Results (fill after run from new path) ────────────────────────────────────
results:
  sharpe: 0.52
  cagr: 0.0721
  max_drawdown: -0.4292
  calmar: 0.17
  turnover_annual: 18.8
  run_at: "2026-05-14"

# ── Run commands ──────────────────────────────────────────────────────────────
