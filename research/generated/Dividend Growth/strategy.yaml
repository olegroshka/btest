# ── Canonical Universe ───────────────────────────────────────────────────────
# Defined ONCE here. All signals import from universe.py — never re-define filters.
# A signal may use a *subset* (e.g. dividend payers only, or EPS-covered only)
# but starts from this base. To change the universe, change universe.py + this block.
universe:
  module: research/generated/Dividend Growth/universe.py   # import LSEUniverse from here
  exchange: LSE
  currencies: [GBX, GBP]          # excludes USD/EUR cross-listings and GDRs
  min_price_gbx: 100.0             # 1 GBP floor — removes shells, warrants, penny stocks
  min_history_days: 252            # ~1 trading year of history before ticker enters pool
  bad_tick_threshold: 0.50         # |1d adj_close return| > 50% → NaN → ffill
  pull_start: "2013-01-01"         # pull earlier than backtest start (warmup data)
  pull_end: "2026-06-01"
  backtest_start: "2015-01-01"
  backtest_end: "2026-01-01"
  approx_size: ~250                # tickers active at any given date (after filters)
  data_sources:
    - eodhd.prices          # OHLCV; filter: exchange='LSE', deprecated_at IS NULL
    - eodhd.instruments     # currency, sector, industry, isin (for filter + contamination checks)
  rationale: >
    100 GBX floor excludes penny stocks, warrants, and shells. Currency filter
    (GBX/GBP) removes ~500 US/EU cross-listings (GDRs, ADRs) that trade near 99 GBX
    but are priced in USD and do not behave as LSE-native equities.
    MinHistory 252d ensures at least 1 year of price history before first signal use.

# ── Thesis ──────────────────────────────────────────────────────────────────
thesis: >
  Stocks that consistently grow their dividends demonstrate sustainable free-cash-flow
  generation and management confidence in the business. Combining high yield with strong
  dividend growth should identify quality compounders priced below intrinsic value,
  while dividend cutters reveal financial stress before it is fully priced in.

# ── Causal chain ─────────────────────────────────────────────────────────────
# Populate as understanding deepens; future: DAG specification
causal_chain:
  - "Dividend growth → management confidence in future FCF → analyst re-rating → price drift"
  - "High yield + growing dividend → income + growth demand → long-term outperformance"
  - "Dividend cut >20% YoY → FCF deterioration signal → underperformance over 6–12 months"
# causal_graph: ~

